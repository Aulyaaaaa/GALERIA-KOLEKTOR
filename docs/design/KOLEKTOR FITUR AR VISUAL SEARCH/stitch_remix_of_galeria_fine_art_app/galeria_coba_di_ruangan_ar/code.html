<script>
  function selectArtwork(imageSrc, title, price, cardElement) {
    const artworkImg = document.getElementById('active-artwork-img');
    const ctaPriceTag = document.getElementById('cta-price-tag');
    
    if (artworkImg) {
      artworkImg.style.opacity = '0';
      setTimeout(() => {
        artworkImg.src = imageSrc;
        artworkImg.style.opacity = '1';
      }, 150);
    }

    if (ctaPriceTag) {
      ctaPriceTag.innerText = price;
    }

    // Reset styles for switcher cards
    document.querySelectorAll('.artwork-card').forEach((el) => {
      el.classList.remove('bg-inverse-surface/80');
      el.classList.add('bg-inverse-surface/40');
      const badge = el.querySelector('.badge-selected');
      if (badge) badge.classList.add('hidden');
    });

    // Mark current card active
    if (cardElement) {
      cardElement.classList.remove('bg-inverse-surface/40');
      cardElement.classList.add('bg-inverse-surface/80');
      const badge = cardElement.querySelector('.badge-selected');
      if (badge) badge.classList.remove('hidden');
    }
  }

  let currentScale = 1;
  let currentRotation = 0;

  function handleToolAction(tool) {
    const target = document.getElementById('ar-artwork-target');
    if (!target) return;

    if (tool === 'scale') {
      currentScale = currentScale === 1 ? 1.15 : (currentScale === 1.15 ? 0.88 : 1);
      target.style.transform = `scale(${currentScale}) rotate(${currentRotation}deg)`;
    } else if (tool === 'rotate') {
      currentRotation = (currentRotation + 8) % 360;
      target.style.transform = `scale(${currentScale}) rotate(${currentRotation}deg)`;
    } else if (tool === 'reset') {
      currentScale = 1;
      currentRotation = 0;
      target.style.transform = 'scale(1) rotate(0deg)';
    }
  }

  function triggerSnapshotPulse() {
    const flash = document.getElementById('snapshot-flash');
    if (!flash) return;
    flash.style.opacity = '0.9';
    setTimeout(() => {
      flash.style.opacity = '0';
    }, 200);
  }
</script></main>
